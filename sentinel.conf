port 26380
bind 127.0.0.1

# monitor the primary — "mymaster" is the name your Go code uses
# last arg = quorum (1 = sentinel alone can trigger failover, fine for single sentinel dev setup)
sentinel monitor mymaster 127.0.0.1 6380 1

# how long (ms) primary must be unreachable before sentinel considers it down
sentinel down-after-milliseconds mymaster 5000

# how long (ms) sentinel waits for a replica to catch up during failover
sentinel failover-timeout mymaster 10000

# how many replicas can be reconfigured at once during failover
sentinel parallel-syncs mymaster 1

loglevel notice
logfile "redis-sentinel.log"