worker_processes auto;

events {
    worker_connections 4096;
}

http {

    # ---- upstream: client servers (WebSocket consumers) ----
    # least_conn ensures new WS connections go to the less-loaded instance.
    # WS connections are long-lived so round_robin would cause imbalance.
    upstream clientservers {
        least_conn;
        server 127.0.0.1:8080;
        #server 127.0.0.1:8082;

        # keepalive: reuse upstream TCP connections for REST calls
        keepalive 64;
    }

    # ---- upstream: data servers (metrics only) ----
    upstream dataservers {
        server 127.0.0.1:8081;
        server 127.0.0.1:8083;
        keepalive 8;
    }

    server {
        listen 80 backlog=4096;
        server_name localhost;

        # ----------------------------------------------------------------
        # WebSocket connections — /ws
        # ----------------------------------------------------------------
        location /ws {
            proxy_pass http://clientservers;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        # ----------------------------------------------------------------
        # Auth + subscription REST endpoints
        # All share the same proxy config block pattern.
        # proxy_read_timeout 30s: bcrypt ~300ms × up to 64 concurrent = worst-case ~2s; 30s is safe headroom
        # at 400 users while still failing fast if Go is truly stuck.
        # keepalive header required when upstream keepalive is set.
        # ----------------------------------------------------------------
        location /login {
            proxy_pass http://clientservers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        location /register {
            proxy_pass http://clientservers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        location /logout {
            proxy_pass http://clientservers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    5s;
            proxy_send_timeout    5s;
        }

        location /subscribe {
            proxy_pass http://clientservers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    5s;
            proxy_send_timeout    5s;
        }

        location /unsubscribe {
            proxy_pass http://clientservers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    5s;
            proxy_send_timeout    5s;
        }

        location /subscriptions {
            proxy_pass http://clientservers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    5s;
            proxy_send_timeout    5s;
        }

        # ----------------------------------------------------------------
        # History REST endpoint
        # ----------------------------------------------------------------
        location /history {
            proxy_pass http://clientservers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ----------------------------------------------------------------
        # Metrics endpoint (data servers)
        # ----------------------------------------------------------------
        location /metrics {
            proxy_pass http://dataservers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ----------------------------------------------------------------
        # Health check — nginx responds directly
        # ----------------------------------------------------------------
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}