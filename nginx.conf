worker_processes 1;

events {
    worker_connections 1024;
}

http {

    # ---- upstream: client servers (WebSocket consumers) ----
    # least_conn ensures new WS connections go to the less-loaded instance.
    # WS connections are long-lived so round_robin would cause imbalance.
    upstream clientservers {
        least_conn;
        server 127.0.0.1:8080;
        server 127.0.0.1:8082;

        # keepalive: reuse upstream TCP connections for /history REST calls
        keepalive 32;
    }

    # ---- upstream: data servers (metrics only) ----
    # round_robin is fine here — /metrics is a short REST call
    upstream dataservers {
        server 127.0.0.1:8081;
        server 127.0.0.1:8083;
        keepalive 8;
    }

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------
        # WebSocket connections — /ws
        # Must pass Upgrade + Connection headers for WS handshake.
        # proxy_read_timeout is long because WS connections are persistent.
        # ----------------------------------------------------------------
        location /ws {
            proxy_pass http://clientservers;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # keep WS connections alive for up to 1 hour
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;
        }

        # ----------------------------------------------------------------
        # History REST endpoint
        # ----------------------------------------------------------------
        location /history {
            proxy_pass http://clientservers;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ----------------------------------------------------------------
        # Metrics endpoint (data servers)
        # ----------------------------------------------------------------
        location /metrics {
            proxy_pass http://dataservers;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ----------------------------------------------------------------
        # Health check endpoint — nginx itself responds 200
        # Useful for external monitoring / load balancer health checks
        # ----------------------------------------------------------------
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}